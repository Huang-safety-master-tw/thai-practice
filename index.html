<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ee6040"><title>泰語開口村｜中文對照口說卡</title>
<style>
:root{--ink:#27211e;--muted:#786c65;--paper:#fff9f0;--orange:#ee6040;--teal:#127d74;--line:#eaded2;--shadow:0 22px 65px #482e1d21}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Noto Sans Thai","Noto Sans TC",system-ui,sans-serif;background:radial-gradient(circle at 5% 5%,#ffe3a6 0,transparent 28rem),radial-gradient(circle at 95% 8%,#d9f1ec 0,transparent 25rem),var(--paper)}button{font:inherit}.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:25px 0 45px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;align-items:center;gap:11px;font-weight:900}.mark{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:#fff;background:var(--orange);box-shadow:0 9px 20px #ee604044}.count{padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:#ffffffb8;color:var(--muted);font-weight:800;font-size:.88rem}.layout{display:grid;grid-template-columns:245px 1fr;gap:22px}.side,.stage{border:1px solid #eaded2cc;background:#ffffffd9;box-shadow:var(--shadow)}.side{align-self:start;border-radius:25px;padding:20px}.side h1{font-size:1.55rem;line-height:1.2;margin:0 0 8px}.side p{font-size:.9rem;line-height:1.6;color:var(--muted);margin:0 0 20px}.topics{display:grid;gap:9px}.topic{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;text-align:left;cursor:pointer;font-weight:800}.topic:hover,.topic.active{border-color:var(--orange);background:#fff2eb}.topic.active{color:#c43e22}.tip{margin-top:18px;padding:12px;border-radius:14px;background:#edf9f6;color:#27655f;font-size:.82rem;line-height:1.55}.stage{min-height:590px;border-radius:30px;padding:clamp(22px,4vw,42px);display:flex;flex-direction:column}.progress{height:9px;border-radius:999px;background:#efe5dc;overflow:hidden}.progress div{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--orange),#ff8a55);transition:width .3s}.eyebrow{margin:36px 0 12px;color:var(--teal);font-size:.82rem;font-weight:900;letter-spacing:.08em}.card{flex:1;min-height:340px;border:0;border-radius:27px;padding:38px 30px;background:linear-gradient(145deg,#fff,#fffaf5);box-shadow:inset 0 0 0 1px var(--line),0 13px 35px #56351e10;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}.card:hover{transform:translateY(-2px)}.zh{font-size:clamp(2rem,5vw,3.2rem);line-height:1.25;font-weight:950;margin-bottom:28px}.divider{width:52px;height:4px;border-radius:9px;background:var(--orange);margin-bottom:25px}.thai{font-size:clamp(1.35rem,3.5vw,2rem);line-height:1.45;font-weight:850;color:var(--teal)}.phonetic{font-size:clamp(1rem,2.5vw,1.3rem);line-height:1.5;color:var(--muted);font-weight:750;margin-top:8px}.note{position:absolute;bottom:17px;color:#a09289;font-size:.76rem}.controls{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;margin-top:18px}.control{border:1px solid var(--line);border-radius:15px;background:#fff;min-height:50px;cursor:pointer;font-weight:900}.speak{border:0;color:#fff;background:var(--orange);box-shadow:0 8px 16px #ee604033}.status{height:22px;text-align:center;margin-top:11px;color:var(--muted);font-size:.82rem}.dots{display:flex;justify-content:center;gap:6px;margin-top:17px}.dot{width:7px;height:7px;border-radius:50%;background:#dfd4ca}.dot.active{width:20px;border-radius:6px;background:var(--orange)}
@media(max-width:720px){.shell{width:min(100% - 18px,600px);padding-top:14px}.layout{grid-template-columns:1fr}.side{padding:14px}.side h1,.side p,.tip{display:none}.topics{grid-template-columns:repeat(3,1fr)}.topic{text-align:center;padding:10px 5px;font-size:.85rem}.stage{min-height:620px;padding:22px 16px;border-radius:24px}.eyebrow{margin-top:27px}.card{padding:30px 18px;min-height:390px}.brand span:last-child{display:none}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><span class="mark">ท</span><span>泰語開口村</span></div><span class="count" id="count"></span></header><div class="layout"><aside class="side"><h1>看中文<br>直接開口說</h1><p>不考選擇題。看中文、跟著發音念，熟悉後再切換下一句。</p><nav class="topics"><button class="topic active" data-topic="daily">日常問候</button><button class="topic" data-topic="food">吃飯聊天</button><button class="topic" data-topic="travel">旅遊購物</button></nav><div class="tip">先只看中文自己試著說，再看下面的泰文發音；點卡片可重播。</div></aside><section class="stage" aria-live="polite"><div class="progress"><div id="bar"></div></div><div class="eyebrow" id="topicName"></div><button class="card" id="card"><div class="zh" id="zh"></div><div class="divider"></div><div class="thai" id="thai"></div><div class="phonetic" id="phonetic"></div><span class="note">點卡片聽發音</span></button><div class="controls"><button class="control" id="prev">←</button><button class="control speak" id="speak">🔊 播放泰語發音</button><button class="control" id="next">→</button></div><div class="status" id="status">先看中文試著說，再播放答案</div><div class="dots" id="dots"></div></section></div></main>
<script>
const lessons={daily:{name:'日常問候',items:[['你好','สวัสดีครับ','薩瓦滴・卡普','sà-wàt-dii khráp'],['你好嗎？','คุณสบายดีไหม','坤・薩掰滴・買','khun sà-baai dii mǎi'],['我很好','ผมสบายดี','澎・薩掰滴','phǒm sà-baai dii'],['你來自哪裡？','คุณมาจากที่ไหน','坤・瑪加・替奶','khun maa jàak thîi nǎi'],['我來自台灣','ผมมาจากไต้หวัน','澎・瑪加・代灣','phǒm maa jàak tâi-wǎn'],['你去過泰國嗎？','คุณเคยไปประเทศไทยไหม','坤・科伊掰・巴貼泰・買','khun khoei pai prà-thêet thai mǎi'],['謝謝','ขอบคุณครับ','擴坤・卡普','khɔ̀ɔp-khun khráp'],['晚安／祝你好夢','ฝันดีนะ','凡滴・那','fǎn dii ná']]},food:{name:'吃飯聊天',items:[['吃飯了嗎？','กินข้าวหรือยัง','京靠・魯揚','gin khâao rʉ̌ʉ yang'],['你喜歡什麼泰國菜？','คุณชอบอาหารไทยอะไร','坤・秋普・阿寒泰・阿萊','khun chɔ̂ɔp aa-hǎan thai à-rai'],['我喜歡冬蔭功','ผมชอบต้มยำกุ้ง','澎・秋普・冬央貢','phǒm chɔ̂ɔp tôm-yam-gûng'],['我喜歡炸雞和糯米飯','ผมชอบไก่ทอดและข้าวเหนียว','澎・秋普・蓋透・雷・靠鳥','phǒm chɔ̂ɔp gài thɔ̂ɔt láe khâao nǐao'],['你做過泰國菜嗎？','คุณเคยทำอาหารไทยไหม','坤・科伊探・阿寒泰・買','khun khoei tham aa-hǎan thai mǎi'],['非常好吃','อร่อยมาก','阿萊・罵','à-rɔ̀i mâak'],['不要辣','ไม่เผ็ด','賣・配','mâi phèt'],['木瓜沙拉','ส้มตำ','宋丹','sôm-tam']]},travel:{name:'旅遊購物',items:[['我要去飯店','ผมจะไปโรงแรม','澎・甲掰・隆廉','phǒm jà pai roong-raem'],['你的飯店在哪裡？','โรงแรมของคุณอยู่ที่ไหน','隆廉・孔坤・由替奶','roong-raem khɔ̌ɔng khun yùu thîi nǎi'],['你會在泰國待多久？','คุณจะอยู่ประเทศไทยนานแค่ไหน','坤・甲由・巴貼泰・南蓋奶','khun jà yùu prà-thêet thai naan khâe nǎi'],['我會待五天','ผมจะอยู่ห้าวัน','澎・甲由・哈灣','phǒm jà yùu hâa wan'],['你要去哪裡玩？','คุณจะไปเที่ยวที่ไหน','坤・甲掰・替優替奶','khun jà pai thîao thîi nǎi'],['多少錢？','เท่าไหร่','淘賴','thâo-rài'],['三百泰銖','สามร้อยบาท','三萊・霸','sǎam rɔ́ɔi bàat'],['不用找了','เก็บไว้เลย','給外・雷','gèp wái loei']]}};
let topic='daily',index=0,audio=null;const $=id=>document.getElementById(id);function render(){const s=lessons[topic],x=s.items[index];$('topicName').textContent=s.name;$('zh').textContent=x[0];$('thai').textContent=x[1];$('phonetic').textContent=x[2]+'　｜　'+x[3];$('count').textContent=`${index+1} / ${s.items.length}`;$('bar').style.width=`${(index+1)/s.items.length*100}%`;$('status').textContent='先看中文試著說，再播放答案';$('dots').innerHTML=s.items.map((_,i)=>`<span class="dot ${i===index?'active':''}"></span>`).join('');localStorage.setItem('thaiCardPosition',JSON.stringify({topic,index}))}function move(d){const n=lessons[topic].items.length;index=(index+d+n)%n;render()}function reset(){ $('speak').disabled=false;$('speak').textContent='🔊 播放泰語發音'}function fail(){reset();$('status').textContent='無法播放：請確認網路，或使用 Chrome／Edge 開啟'}async function speak(){const x=lessons[topic].items[index],b=$('speak');b.disabled=true;b.textContent='正在播放…';$('status').textContent='跟著念兩次：'+x[2];try{if(audio)audio.pause();audio=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=th&q='+encodeURIComponent(x[1]));audio.onended=reset;await audio.play()}catch(e){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x[1]),v=speechSynthesis.getVoices().find(z=>z.lang.toLowerCase().startsWith('th'));if(v)u.voice=v;u.lang='th-TH';u.rate=.7;u.onend=reset;u.onerror=fail;speechSynthesis.speak(u);setTimeout(()=>{if(!speechSynthesis.speaking&&!speechSynthesis.pending)fail()},700)}else fail()}}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('speak').onclick=speak;$('card').onclick=speak;document.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;index=0;document.querySelectorAll('.topic').forEach(x=>x.classList.toggle('active',x===b));render()});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight'||e.key===' ')move(1);if(e.key==='Enter')speak()});try{const s=JSON.parse(localStorage.getItem('thaiCardPosition'));if(s&&lessons[s.topic]){topic=s.topic;index=Math.min(s.index,7);document.querySelectorAll('.topic').forEach(x=>x.classList.toggle('active',x.dataset.topic===topic))}}catch(e){}render();
</script><script src="core-vocab.js?v=20260904"></script><script src="today-lesson.js?v=20260904-2"></script><script src="audio-fix.js?v=20260904"></script></body></html>
